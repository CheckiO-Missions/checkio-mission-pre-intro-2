    <div class="question">
        Jak ustawić wartości zmiennych (add, multi) na wyrażenia odpowiednio sumy i iloczynu wcześniej zadeklarowanych zmiennych (roboty, droidy)?
    </div>
    <div class="answer">
        <pre class="brush: python">
robots, droids = 2, 5

add = robots + droids
multi = robots * droids
        </pre>
    </div>
</div>
